[project]
name = "klipai-backend"
version = "0.1.0"
description = "Django backend for KlipAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6.0",
    "psycopg2-binary>=2.9.11",
    "django-cors-headers>=4.9.0",
    "djangorestframework",
    "celery>=5.5.3",
    "redis>=7.1.0",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "openai-whisper",
    "google-genai",
    "boto3>=1.34.0",
    "yt-dlp>=2024.1.0",
    "stripe>=10.0.0",
    "django-redis>=5.4.0",
    "mediapipe",
    "protobuf==4.25.3",
    "opencv-python-headless",
    "onnxruntime",
    "insightface",
]

[tool.uv]
package = false
